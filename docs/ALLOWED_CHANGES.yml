# Intentional changes for the Ликвидность transformation.
#
# The moved/shifted block is final columns BW:FY (75:181), rows 1:last_data_row.
# Source columns FF:FG (162:163) move to BW:BX (75:76).
# Source columns EA (131, "Исчезнувшие") and EB (132, "Период") are deleted;
# the output is 181 columns.
# Source columns BW:DZ (75:130) shift right by two to BY:EB (77:132).
# Source columns EC:FE (133:161) stay in place (move and deletion cancel).
# Source columns FH:GA (164:183) shift left by two to FF:FY (162:181).
# Row-dependent ranges use the Excel maximum row so the whitelist remains valid
# for workbooks with more than the 100-row sample.
#
# Observability (elapsed-time print, progress bar, and logging added to
# transform.py / run_production.py / run_batch.py) is side-channel output only.
# It does not alter any cell, formula, format, or style, so it requires no new
# allowed ranges here.

allowed_ranges:
  - sheet: Ликвидность
    range: BW1:FY1048576
    reason: Move FF/FG to BW/BX, delete the Исчезнувшие (EA/131) and Период (EB/132) columns, and shift the remaining columns per the final mapping (output is 181 columns)
  - sheet: Ликвидность
    range: I10:I1048576
    reason: Display Дата заключения as dd.mm.yyyy while keeping native date values
  - sheet: Ликвидность
    range: J10:J1048576
    reason: Display Дата расторжения договора as dd.mm.yyyy while keeping native date values
  - sheet: Ликвидность
    range: S10:S1048576
    reason: Display ДЗ начальная дата образования as dd.mm.yyyy while keeping native date values
  - sheet: Ликвидность
    range: T10:T1048576
    reason: Display first ДЗ конечная дата образования as dd.mm.yyyy while keeping native date values
  - sheet: Ликвидность
    range: BB7:BB7
    reason: Add dynamic SUBTOTAL(109, BB10:BB{last_data_row + 1}) row-7 total
  - sheet: Ликвидность
    range: CV7:CV7
    reason: Add dynamic SUBTOTAL(109, CV10:CV{last_data_row + 1}) row-7 total
  - sheet: Ликвидность
    range: CU9:CU9
    reason: Replace the date in the БУ ДЗ всего на header with sh513.xlsx!B1
  - sheet: Ликвидность
    range: CV9:CV9
    reason: Replace the date in the просроченная ДЗ header with sh513.xlsx!B1
  - sheet: Ликвидность
    range: CY9:CY9
    reason: Replace the date in the БУ Авансы на header with sh513.xlsx!B1

allowed_columns: []

