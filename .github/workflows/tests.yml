name: Excel Automation Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # requirements.txt points at ../excel-framework-core for local dev (editable
      # sibling checkout), which doesn't exist on the runner — install deps and the
      # tagged core package release directly instead.
      - run: pip install "openpyxl>=3.1.0" "pytest>=8.0"
      - run: pip install "git+https://x-access-token:${{ secrets.CORE_REPO_TOKEN }}@github.com/Sergey-Gromov/excel-framework-core.git@v0.1.0"
      - run: pytest
